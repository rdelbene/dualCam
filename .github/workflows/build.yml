name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk DualCam3D.apk
      - uses: actions/upload-artifact@v5
        with:
          name: DualCam3D-apk
          path: DualCam3D.apk
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DualCam3D.apk --title "DualCam 3D (última versión)" --notes "APK compilado automáticamente desde ${GITHUB_SHA::7}."
